# Calls the deployed /api/sync endpoint on an hourly schedule to pull in
# the latest quantities/prices/items from the Amazon registry.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL     the deployed site's base URL, e.g. https://your-site.vercel.app
#   SYNC_SECRET  same value as the SYNC_SECRET env var configured on the site
#
# Can also be triggered manually from the Actions tab (workflow_dispatch).
name: Sync Amazon registry

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -euo pipefail

          response="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            "${SITE_URL}/api/sync")"

          echo "${response}" | jq .

          status="$(echo "${response}" | jq -r '.status')"
          if [ "${status}" = "error" ]; then
            echo "::error::Sync reported status=error"
            exit 1
          fi
